<!DOCTYPE html>
<html>
<head>
    <title>Редактировать задачу</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        input, button { padding: 8px; margin: 5px; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Редактирование задачи</h1>
    {% if message %}
        <p class="error">{{ message }}</p>
    {% endif %}
    <form method="POST">
        <input type="text" name="item" value="{{ item.name }}">
        <input type="text" name="item" value="{{ item.message }}">
        <button type="submit">Сохранить</button>
        <a href="/">Отмена</a>
    </form>
</body>
</html>
